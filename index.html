<style>
  :root{
    --paper:#EEF1F5;
    --surface:#FFFFFF;
    --ink:#11151A;
    --muted:#525C6A;
    --muted2:#3E4753;
    --line:#D4DAE3;
    --line-soft:#E6EAF0;
    --accent:#1B45C4;
    --price:#0A6055;
    --caution:#AE3A08;
    --notice:#5B36B5;
    --general:#4A5462;
    --high:#A81E26;
    --up:#A81E26;
    --down:#0A6055;
    --r:10px;
    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    word-break:keep-all;
    overflow-wrap:anywhere;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  /* ── 상단 ── */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(238,241,245,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand h1{
    margin:0;font-size:19px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;
  }
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.14em;font-weight:700}
  .today{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:-.01em}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:8px 15px;min-width:210px;
  }
  .search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}
  .search svg{flex:none;opacity:.5}
  .ghost{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink);
  }
  .ghost:hover{border-color:#AEB8C6;background:#F7F9FC}

  /* ── 탭 ── */
  .tabs{display:flex;gap:2px;margin:24px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{
    background:none;border:0;padding:10px 17px 12px;font-size:16px;font-weight:700;white-space:nowrap;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:-.01em;
  }
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .cnt{font-family:var(--mono);font-size:12px;opacity:.65;margin-left:5px}

  /* ── 기간 ── */
  .rangebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{
    border:0;background:none;padding:7px 17px;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted)
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .rangenote{font-family:var(--mono);font-size:13px;color:var(--muted)}

  /* ── 카드 공통 ── */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .panel-h{
    display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft)
  }
  .panel-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .panel-h .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-left:auto}

  /* ── 대시보드 그리드 ── */
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
  .stack{display:grid;gap:16px}

  /* 중요 이슈 */
  .lead{padding:4px 0}
  .lead-item{
    display:block;width:100%;text-align:left;background:none;border:0;
    padding:15px 18px 16px;border-bottom:1px solid var(--line-soft);position:relative;
  }
  .lead-item:last-child{border-bottom:0}
  .lead-item:hover{background:#F5F8FC}
  .lead-item::before{
    content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--type-c,var(--general))
  }
  .lead-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .lead-t{font-size:16px;font-weight:750;letter-spacing:-.022em;line-height:1.45}
  .lead-b{font-size:14px;line-height:1.68;color:var(--muted2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .chip{
    font-size:12.5px;font-weight:700;letter-spacing:0;padding:3px 9px;border-radius:6px;
    background:color-mix(in srgb,var(--type-c,var(--general)) 13%,#fff);
    color:var(--type-c,var(--general));white-space:nowrap;
  }
  .site{

          날짜(<code>8/18</code>), 현장명, <code>12,000원 → 13,500원</code> 형태의 가격은 자동으로 인식합니다.

<script>
/* ─────────── 저장소 ─────────── */
const KEY = 'arte_issue_checker_v1';
const mem = {};
const store = {
  async get(){
    try{
      if(window.storage){ const r = await window.storage.get(KEY); return r? JSON.parse(r.value):null; }
    }catch(e){}
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return mem[KEY] || null;
  },
  async set(v){
    const s = JSON.stringify(v);
    mem[KEY]=v;
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

/* ─── 파일 연동(공유 폴더 저장) ─── */
const supportsFS = typeof window.showSaveFilePicker === 'function';
let fileHandle = null;      // 연결된 JSON 파일
let lastSync = null;        // 마지막 저장 시각
let linkState = 'none';     // none | linked | need-permission | error
let saveTimer = null, syncing = false, lastPull = 0;

const idb = {
  open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open('arte-issue-checker', 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    });
  },
  async get(k){
    try{
      const db = await this.open();
      return await new Promise((res,rej)=>{
        const q = db.transaction('kv','readonly').objectStore('kv').get(k);
        q.onsuccess = ()=> res(q.result); q.onerror = ()=> rej(q.error);
      });
    }catch(e){ return null; }
  },
  async set(k,v){
    try{
      const db = await this.open();
      await new Promise((res,rej)=>{
        const q = db.transaction('kv','readwrite').objectStore('kv').put(v,k);
        q.onsuccess = res; q.onerror = ()=> rej(q.error);
      });
    }catch(e){}
  },
  async del(k){
    try{
      const db = await this.open();
      await new Promise((res,rej)=>{
        const q = db.transaction('kv','readwrite').objectStore('kv').delete(k);
        q.onsuccess = res; q.onerror = ()=> rej(q.error);
      });
    }catch(e){}
  }
};

function payload(){
  return {app:'arte-issue-checker', version:2, savedAt:new Date().toISOString(), items:DATA};
}

/* 같은 id는 최근에 고친 쪽을 남기고 합친다 */
function mergeItems(a, b){
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(it=>{
    if(!it || !it.id) return;
    const prev = map.get(it.id);
    if(!prev || (it.updatedAt||it.createdAt||0) >= (prev.updatedAt||prev.createdAt||0)) map.set(it.id, it);
  });
  return [...map.values()];
}

async function ensurePermission(mode){
  if(!fileHandle) return false;
  try{
    if(await fileHandle.queryPermission({mode}) === 'granted') return true;
    if(await fileHandle.requestPermission({mode}) === 'granted') return true;
  }catch(e){}
  linkState = 'need-permission'; renderLink();
  return false;
}

async function writeFile(){
  if(!fileHandle) return;
  if(!await ensurePermission('readwrite')) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(payload(), null, 2));
    await w.close();
    lastSync = new Date(); linkState = 'linked'; renderLink();
  }catch(e){ linkState = 'error'; renderLink(); }
}

function scheduleWrite(){
  if(!fileHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFile, 700);
}

async function pullFile({silent}={}){
  if(!fileHandle || syncing) return;
  if(!await ensurePermission('readwrite')) return;
  syncing = true;
  try{
    const f = await fileHandle.getFile();
    const txt = await f.text();
    if(txt.trim()){
      const j = JSON.parse(txt);
      const items = Array.isArray(j) ? j : j.items;
      if(Array.isArray(items)){
        const before = DATA.length;
        DATA = mergeItems(items, DATA);
        lastSync = new Date(); linkState = 'linked';
        renderAll(); renderLink();
        await store.set(DATA);
        if(!silent && DATA.length !== before) toast(`파일에서 ${DATA.length - before}건을 불러왔습니다`);
      }
    }
  }catch(e){ linkState = 'error'; renderLink(); }
  syncing = false;
}

async function linkFile(mode){
  try{
    if(mode === 'new'){
      fileHandle = await window.showSaveFilePicker({
        suggestedName: '아르떼조명상담이슈체커_데이터.json',
        types: [{description:'이슈 데이터', accept:{'application/json':['.json']}}]
      });
      await idb.set('fileHandle', fileHandle);
      linkState = 'linked';
      await writeFile();
      toast('저장 파일을 연결했습니다');
    }else{
      const [h] = await window.showOpenFilePicker({
        types: [{description:'이슈 데이터', accept:{'application/json':['.json']}}]
      });
      fileHandle = h;
      await idb.set('fileHandle', fileHandle);
      linkState = 'linked';
      await pullFile();
      await writeFile();
      toast('저장 파일을 연결했습니다');
    }
  }catch(e){ /* 사용자가 취소 */ }
  renderLink();
}

async function unlinkFile(){
  fileHandle = null; linkState = 'none'; lastSync = null;
  await idb.del('fileHandle');
  renderLink(); toast('연결을 해제했습니다');
}

function renderLink(){
  const el = $('#linkStat'); if(!el) return;
  const name = fileHandle ? fileHandle.name : '';
  if(linkState === 'linked'){
    const t = lastSync ? `${String(lastSync.getHours()).padStart(2,'0')}:${String(lastSync.getMinutes()).padStart(2,'0')} 저장됨` : '연결됨';
    el.innerHTML = `<span class="ld ok"></span>${esc(name)} · ${t}`;
    el.title = '자동 저장 중입니다';
  }else if(linkState === 'need-permission'){
    el.innerHTML = `<span class="ld warn"></span>연결 확인 필요`;
  }else if(linkState === 'error'){
    el.innerHTML = `<span class="ld warn"></span>저장 실패`;
  }else{
    el.innerHTML = `<span class="ld off"></span>이 브라우저에만 저장 중`;
  }
}

/* ─────────── 유형 정의 ─────────── */
const TYPES = {
  price:   {label:'가격변동',  color:'var(--price)'},
  caution: {label:'시공주의',  color:'var(--caution)'},
  notice:  {label:'공지·변경', color:'var(--notice)'},
  general: {label:'일반이슈',  color:'var(--general)'}
};
const LEVELS = {high:'중요', mid:'보통', low:'참고'};

const KW = {
  price:   ['가격','단가','금액','인상','인하','할인','견적','공임','자재비','판매가','원가','정산','추가비용','인건비','시공비','상승','인상분'],
  caution: ['주의','필수','반드시','금지','불가','위험','하자','재시공','파손','누락','안전','확인요망','유의','체크','오류','미시공','확인 후','사고'],
  notice:  ['공지','안내','변경','신규','중단','단종','품절','입고','출시','교체','업데이트','연기','지연','대체']
};
const HIGH_KW = ['긴급','즉시','반드시','필수','전체','중단','하자','사고','클레임','민원','금지','불가','오늘까지','전 현장'];
const LOW_KW  = ['참고','예정','검토','논의','예상'];

const SITE_SUFFIX = '(아파트|자이|푸르지오|래미안|힐스테이트|e편한세상|이편한세상|더샵|아이파크|롯데캐슬|SK뷰|한신더휴|데시앙|스위첸|우미린|호반써밋|해링턴|센트레빌|리슈빌|풍경채|어울림|베르디움|리버파크|센트럴|현장|단지|타운|시티|파크)';

/* ─────────── 상태 ─────────── */
let DATA = [];      // 이슈 배열
let drafts = [];
let range = 7;
let monthCursor = new Date();
let selectedDay = null;
let typeFilter = 'all';
let splitMode = 'auto';
let siteFilter = null;
let query = '';
let editing = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => Number(n).toLocaleString('ko-KR');
const todayStr = () => new Date().toISOString().slice(0,10);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900);
}

/* ─────────── 파서 ─────────── */
function guessDate(text){
  let m = text.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = text.match(/(\d{1,2})월\s*(\d{1,2})일/);
  if(m) return `${new Date().getFullYear()}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = text.match(/(?:^|\s)(\d{1,2})[.\/](\d{1,2})(?=\s|$|[^\d])/);
  if(m && +m[1]<=12 && +m[2]<=31) return `${new Date().getFullYear()}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  if(/어제/.test(text)){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
  return todayStr();
}

function guessSite(text){
  // "현장: OO" 형태 우선
  let m = text.match(/(?:현장|아파트|단지)\s*[:：]\s*([^\n,/]{2,20})/);
  if(m) return m[1].trim();
  const known = [...new Set(DATA.map(d=>d.site).filter(Boolean))];
  for(const k of known){ if(text.includes(k)) return k; }
  const re = new RegExp('([가-힣A-Za-z0-9]{2,12}\\s*' + SITE_SUFFIX + '(?:\\s*\\d{1,2}\\s*(?:차|단지|블록|BL))?)');
  m = text.match(re);
  if(m) return m[1].replace(/\s+/g,' ').trim();
  return '';
}

function guessType(text){
  const score = {price:0,caution:0,notice:0};
  for(const [t,words] of Object.entries(KW))
    for(const w of words) if(text.includes(w)) score[t] += (t==='price'?1:1);
  if(/[\d,]{2,}\s*원\s*(?:→|->|=>|에서)/.test(text)) score.price += 3;
  else if(/[\d,]{3,}\s*원/.test(text)) score.price += 1.5;
  const best = Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  return best[1] > 0 ? best[0] : 'general';
}

function guessLevel(text){
  if(HIGH_KW.some(w=>text.includes(w))) return 'high';
  if(LOW_KW.some(w=>text.includes(w))) return 'low';
  return 'mid';
}

function extractPrices(text){
  const out = [];
  const re = /([가-힣A-Za-z0-9()·\-\s]{0,18}?)\s*(?:단가|가격|금액)?\s*([\d][\d,]{1,})\s*원?\s*(?:→|->|=>|➡|에서)\s*([\d][\d,]{1,})\s*원/g;
  let m;
  while((m = re.exec(text))){
    const before = parseInt(m[2].replace(/,/g,''),10);
    const after  = parseInt(m[3].replace(/,/g,''),10);
    if(!before || !after) continue;
    out.push({item: cleanItem(m[1]) || '단가', before, after});
  }
  if(out.length) return out;
  const re2 = /([가-힣A-Za-z0-9()·\-\s]{0,18}?)\s*(?:단가|가격|금액)?\s*([\d][\d,]{2,})\s*원/g;
  while((m = re2.exec(text))){
    const v = parseInt(m[2].replace(/,/g,''),10);
    if(!v) continue;
    out.push({item: cleanItem(m[1]) || '금액', before:null, after:v});
    if(out.length>=3) break;
  }
  return out;
}
function cleanItem(s){
  return (s||'').replace(/[\d,]+$/,'')
    .replace(/(?:은|는|이|가|을|를|의|로|으로|에서|는요)$/,'')
    .replace(/^[\s\-–•·,\/]+/,'').replace(/[\s,\/]+$/,'').trim().slice(0,20);
}

function stripMeta(line){
  return line.replace(/^[\s\-–•·*]+/,'')
             .replace(/^(20\d{2}[.\-\/]\d{1,2}[.\-\/]\d{1,2}|\d{1,2}[.\/]\d{1,2}|\d{1,2}월\s*\d{1,2}일)\s*[)\]\-:／/]*\s*/,'')
             .trim();
}

function parseOne(text){
  const t = text.trim();
  if(!t) return null;
  const date = guessDate(t);
  const site = guessSite(t);
  const type = guessType(t);
  const level = guessLevel(t);
  const prices = extractPrices(t);

  const lines = t.split('\n').map(stripMeta).filter(Boolean);
  const full = lines.join('\n');
  let first = lines[0] || t;
  if(site && first.startsWith(site)) first = first.slice(site.length).replace(/^[\s\-–:/|,]+/,'');
  first = first.replace(/^[\s\-–:/|,]+/,'').trim();

  let title, body;
  if(first.length > 58){
    // 긴 문장은 첫 문장까지만 제목으로, 원문은 통째로 본문에 보관
    const m = first.match(/^[\s\S]{12,58}?(?:다\.|요\.|음\.|함\.|[.!?])(?=\s|$)/);
    if(m){ title = m[0].trim(); body = full.slice(full.indexOf(m[0]) + m[0].length).trim(); }
    else  { title = first.slice(0,56).trim() + '…'; body = full; }
  }else{
    title = first;
    body = lines.slice(1).join('\n');
  }
  if(!title) title = TYPES[type].label;

  return {id:uid(), date, site, type, level, title, body, prices, raw:full, createdAt:Date.now()};
}

function parseBlocks(raw, mode){
  if(mode === 'one'){ const p = parseOne(raw); return p ? [p] : []; }
  if(mode === 'line'){
    return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(parseOne).filter(Boolean);
  }
  const blocks = raw.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  const out = [];
  for(const b of blocks){
    const lines = b.split('\n').filter(l=>l.trim());
    const bulletish = lines.length>1 && lines.every(l=>/^[\s\-–•·*]|^\d{1,2}[.\/]\d{1,2}|^20\d{2}[.\-\/]/.test(l));
    if(bulletish) lines.forEach(l=>{ const p=parseOne(l); if(p) out.push(p); });
    else { const p=parseOne(b); if(p) out.push(p); }
  }
  return out;
}

/* ─────────── 필터 ─────────── */
function monthKey(){
  return `${monthCursor.getFullYear()}-${String(monthCursor.getMonth()+1).padStart(2,'0')}`;
}
function inRange(d){
  if(range === 'month'){
    return selectedDay ? d.date === selectedDay : d.date.startsWith(monthKey());
  }
  if(!range) return true;
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-(range-1));
  return new Date(d.date+'T00:00:00') >= from;
}
function haystack(d){
  return [d.title, d.body, d.raw, d.site, TYPES[d.type].label, (d.prices||[]).map(p=>p.item).join(' ')].filter(Boolean).join(' ');
}
function matchQuery(d){
  if(!query) return true;
  return haystack(d).toLowerCase().includes(query.toLowerCase());
}
function hl(text){
  const s = esc(text || '');
  if(!query) return s;
  const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return s.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`); }catch(e){ return s; }
}
function snippet(d){
  const src = (d.body || d.raw || '').replace(/\n+/g,' ');
  if(!query) return src.slice(0,170);
  const i = src.toLowerCase().indexOf(query.toLowerCase());
  if(i < 0) return src.slice(0,170);
  const s = Math.max(0, i-70);
  return (s>0?'… ':'') + src.slice(s, s+190) + (src.length > s+190 ? ' …' : '');
}
const sortByDate = (a,b)=> (b.date.localeCompare(a.date)) || (b.createdAt-a.createdAt);

/* ─────────── 렌더 ─────────── */
function typeStyle(t){ return `--type-c:${TYPES[t].color}`; }

function renderSearch(){
  const p = $('#searchPanel');
  if(!query){ p.hidden = true; p.innerHTML = ''; return; }
  const hits = DATA.filter(matchQuery).sort(sortByDate);
  p.hidden = false;
  p.innerHTML =
    `<div class="panel-h"><h2>‘${esc(query)}’ 검색 결과</h2><span class="n">${hits.length}건 · 전체 기간</span></div>` +
    (hits.length ? hits.slice(0,25).map(d=>`
      <button class="lead-item" style="${typeStyle(d.type)}" data-view="${d.id}">
        <div class="lead-meta">
          <span class="chip">${TYPES[d.type].label}</span>
          ${d.site?`<span class="site">${hl(d.site)}</span>`:''}
          ${d.level==='high'?'<span class="flag">중요</span>':''}
          <span class="date">${d.date}</span>
        </div>

function renderCalendar(){
  const p = $('#calPanel');
  if(range !== 'month'){ p.hidden = true; p.innerHTML=''; return; }
  p.hidden = false;

  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(y, m+1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);

  const byDay = {};
  DATA.forEach(d=>{ (byDay[d.date] = byDay[d.date] || []).push(d); });
  const monthCount = DATA.filter(d=>d.date.startsWith(monthKey())).length;

  let cells = '';
  for(let i=0; i<weeks*7; i++){
    const dt = new Date(start); dt.setDate(start.getDate()+i);
    const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const list = (byDay[key] || []).slice().sort((a,b)=>({high:0,mid:1,low:2}[a.level]-{high:0,mid:1,low:2}[b.level]));
    const cls = [
      'cal-cell',
      dt.getMonth()!==m ? 'out' : '',
      dt.getDay()===0 ? 'sun' : '',
      key===todayStr() ? 'today' : '',
      key===selectedDay ? 'sel' : ''
    ].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-day="${key}">
      <span class="dnum">${dt.getDate()}</span>
      ${list.slice(0,2).map(d=>`<span class="cal-item" style="${typeStyle(d.type)}">${esc(d.title)}</span>`).join('')}
      ${list.length>2 ? `<span class="cal-more">+${list.length-2}건</span>` : ''}
      ${list.length ? `<span class="dots">${[...new Set(list.map(d=>d.type))].map(t=>`<span class="dot" style="--type-c:${TYPES[t].color}"></span>`).join('')}</span>` : ''}
    </button>`;
  }

  p.innerHTML = `
    <div class="cal-h">
      <button class="navb" id="calPrev" aria-label="이전 달">‹</button>
      <span class="mtitle">${y}년 ${m+1}월</span>
      <button class="navb" id="calNext" aria-label="다음 달">›</button>
      <button class="ghost" id="calToday">이번 달</button>
      <span class="cal-note">${monthCount}건${selectedDay?` · ${selectedDay.slice(5).replace('-','/')} 선택` : ''}</span>
    </div>
    <div class="cal-grid">
      ${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="cal-dow${i===0?' sun':''}">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

function askConfirm({title, message, target, type, confirmLabel, danger}){
  return new Promise(resolve=>{
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.style.zIndex = 70;
    mask.innerHTML = `<div class="modal confirm" role="alertdialog" aria-modal="true" ${type?`style="${typeStyle(type)}"`:''}>
      <div class="modal-b">
        <h3 class="cf-title">${esc(title)}</h3>
        <p class="cf-msg">${esc(message)}</p>
        ${target ? `<div class="cf-target">${esc(target)}</div>` : ''}
      </div>
      <div class="cf-actions">
        <button class="ghost" data-a="no">취소</button>
        <button class="${danger?'danger':'primary'}" data-a="yes">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    const done = v=>{ mask.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey);
    mask.addEventListener('click', e=>{
      if(e.target === mask) return done(false);
      const a = e.target.closest('[data-a]');
      if(a) done(a.dataset.a === 'yes');
    });
    mask.querySelector('[data-a="no"]').focus();   // 기본 포커스는 '취소'
  });
}

/* ─────────── 본문 서식 ─────────── */
function formatBody(text){
  const lines = (text||'').split('\n').map(l=>l.trim());
  const out = [];
  let para = [], items = [];

  const flushP = ()=>{ if(para.length){ out.push(`<p>${hl(para.join(' '))}</p>`); para=[]; } };
  const flushL = ()=>{ if(items.length){ out.push(`<ul>${items.map(i=>`<li>${hl(i)}</li>`).join('')}</ul>`); items=[]; } };

  const isHeading = l=>{
    const core = l.replace(/\s*[\(（][^)）]*[\)）]\s*$/,'').trim();
    if(core.length === 0 || core.length > 22) return false;
    return /(안내|사항|주의|참고|공지|정리|요약|조건|기준|문의)$/.test(core)
        || /^[■●▶◆※▪◇\[【]/.test(l)
        || /[:：]$/.test(l);
  };
  const isItem = l=>
       /^[-–—•·*]\s?/.test(l)
    || /^\d+[.)]\s/.test(l)
    || (/\s[-–~]\s/.test(l) && l.length < 50);

  const endsSentence = l=> /[.!?…,]$/.test(l) || /(니다|습니다|합니다|됩니다|입니다|함|음|요|죠|임)$/.test(l);

  for(const l of lines){
    if(!l){ flushP(); flushL(); continue; }
    if(isHeading(l)){
      flushP(); flushL();
      out.push(`<h4>${hl(l.replace(/^[■●▶◆※▪◇]\s*/,''))}</h4>`);
      continue;
    }
    if(isItem(l)){
      flushP();
      items.push(l.replace(/^[-–—•·*]\s?/,''));
      continue;
    }
    flushL();
    para.push(l);
    if(endsSentence(l)) flushP();   // 문장이 끝나면 문단도 끊는다
  }
  flushP(); flushL();
  return out.join('') || `<p>${hl(text||'')}</p>`;
}

    </div>
    <div class="modal-b">
      <h2 class="vtitle">${hl(d.title)}</h2>
      ${d.prices && d.prices.length ? `<div class="vprice">${d.prices.map(p=>{
        let delta='';
        if(p.before && p.after){
          const pct=((p.after-p.before)/p.before*100), up=p.after>p.before;
          delta=`<span class="delta ${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(pct).toFixed(1)}%</span>`;
        }
        return `<div class="prow">
          <div class="pname">${esc(p.item)}</div>
          <div class="pnum">${p.before?`<span class="old">${won(p.before)}</span>`:''}<span class="new">${won(p.after)}원</span>${delta}</div>
        </div>`;
      }).join('')}</div>` : ''}
      <div class="vbody">${formatBody(d.body || d.raw || '')}</div>
    </div>
    <div class="bar">
      <button class="primary" id="vEdit">수정</button>
      <button class="ghost" id="vDel">삭제</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  const close = ()=>{ mask.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', e=>{ if(e.target===mask) close(); });
  mask.querySelector('#vClose').onclick = close;
  mask.querySelector('#vEdit').onclick = async ()=>{
    if(await confirmEdit(d)){ close(); openModal(d); }
  };
  mask.querySelector('#vDel').onclick = async ()=>{
    if(!await confirmDelete(d)) return;
    DATA = DATA.filter(x=>x.id!==d.id);
    await persist(); close(); renderAll(); toast('삭제했습니다');
  };
}

/* ─────────── 모달 ─────────── */
function openModal(item){
  editing = item ? {...item, prices:(item.prices||[]).map(p=>({...p}))}
                 : {id:uid(), date:todayStr(), site:'', type:'general', level:'mid', title:'', body:'', prices:[], createdAt:Date.now()};
  const p = editing.prices[0] || {};
  const mask = document.createElement('div');
  mask.className='mask'; mask.id='mask';
  mask.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${item?'이슈 수정':'이슈 직접 입력'}</h3><button class="ghost" id="mClose" style="margin-left:auto">닫기</button></div>
    <div class="modal-b">
      <div class="two">
        <div class="fld"><label>날짜</label><input type="date" id="mDate" value="${editing.date}"></div>
        <div class="fld"><label>현장</label><input type="text" id="mSite" value="${esc(editing.site)}" placeholder="예) 힐스테이트 3차"></div>
      </div>
      <div class="two">
        <div class="fld"><label>분류</label><select id="mType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${editing.type===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
        <div class="fld"><label>중요도</label><select id="mLevel">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${editing.level===k?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="fld"><label>제목</label><input type="text" id="mTitle" value="${esc(editing.title)}" placeholder="한 줄 요약"></div>
      <div class="fld"><label>내용</label><textarea id="mBody" placeholder="상세 내용">${esc(editing.body)}</textarea></div>
      <div class="fld"><label>가격 (선택)</label>
        <div class="two" style="grid-template-columns:1.4fr 1fr 1fr">
          <input type="text" id="mItem" value="${esc(p.item||'')}" placeholder="품목">
          <input type="text" id="mBefore" value="${p.before?won(p.before):''}" placeholder="이전가">
          <input type="text" id="mAfter" value="${p.after?won(p.after):''}" placeholder="변경가">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="primary" id="mSave">저장</button>
        ${item?'<button class="ghost" id="mDel">삭제</button>':''}
      </div>
    </div></div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e=>{ if(e.target===mask) mask.remove(); });
  $('#mClose').onclick = ()=> mask.remove();
  $('#mSave').onclick = async ()=>{
    const num = s => { const v=parseInt((s||'').replace(/[^\d]/g,''),10); return v||null; };
    const item2 = $('#mItem').value.trim(), b=num($('#mBefore').value), a=num($('#mAfter').value);
    const obj = {
      id: editing.id, date: $('#mDate').value || todayStr(), site: $('#mSite').value.trim(),
      type: $('#mType').value, level: $('#mLevel').value,
      title: $('#mTitle').value.trim() || '(제목 없음)', body: $('#mBody').value.trim(),
      prices: a ? [{item:item2||'단가', before:b, after:a}] : [],
      createdAt: editing.createdAt || Date.now(), updatedAt: Date.now()
    };
    const idx = DATA.findIndex(d=>d.id===obj.id);
    if(idx>=0) DATA[idx]=obj; else DATA.unshift(obj);
    await persist(); mask.remove(); renderAll(); toast(idx>=0?'수정했습니다':'등록했습니다');
  };
  if(item) $('#mDel').onclick = async ()=>{
    if(!await confirmDelete(item)) return;
    DATA = DATA.filter(d=>d.id!==item.id); await persist(); mask.remove(); renderAll(); toast('삭제했습니다');
  };
}

async function persist(){
  DATA.forEach(d=>{ if(!d.updatedAt) d.updatedAt = d.createdAt || Date.now(); });
  await store.set(DATA);
  scheduleWrite();
}

/* ─────────── 이벤트 ─────────── */
$$('.tab').forEach(b=> b.onclick = ()=>{
  $$('.tab').forEach(x=>x.setAttribute('aria-selected', x===b));
  ['dash','add','list','site'].forEach(t=> $('#tab-'+t).hidden = (t!==b.dataset.tab));
});

$('#seg').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  range = b.dataset.r === 'month' ? 'month' : +b.dataset.r;
  selectedDay = null;
  if(range === 'month') monthCursor = new Date();
  [...$('#seg').children].forEach(x=>x.setAttribute('aria-pressed', x===b));
  renderDash();
};

$('#calPanel').addEventListener('click', e=>{
  if(e.target.closest('#calPrev')){ monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1); selectedDay=null; return renderDash(); }
  if(e.target.closest('#calNext')){ monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1); selectedDay=null; return renderDash(); }
  if(e.target.closest('#calToday')){ monthCursor = new Date(); selectedDay=null; return renderDash(); }
  const cell = e.target.closest('[data-day]');
  if(cell){
    const key = cell.dataset.day;
    selectedDay = (selectedDay === key) ? null : key;
    const [yy,mm] = key.split('-').map(Number);
    if(mm-1 !== monthCursor.getMonth() || yy !== monthCursor.getFullYear()) monthCursor = new Date(yy, mm-1, 1);
    renderDash();
  }
});

$('#q').oninput = e=>{ query = e.target.value.trim(); renderAll(); };

$('#modeSeg').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  splitMode = b.dataset.m;
  [...$('#modeSeg').children].forEach(x=>x.setAttribute('aria-pressed', x===b));
  if($('#raw').value.trim()){ drafts = parseBlocks($('#raw').value, splitMode); renderDrafts(); }
};

$('#btnParse').onclick = ()=>{
  const raw = $('#raw').value;
  if(!raw.trim()) return toast('내용을 먼저 붙여넣으세요');
  drafts = parseBlocks(raw, splitMode);
  renderDrafts();
  toast(`${drafts.length}건으로 분류했습니다`);
};
$('#btnClearRaw').onclick = ()=>{ $('#raw').value=''; drafts=[]; renderDrafts(); };
$('#btnManual').onclick = ()=> openModal(null);

$('#drafts').addEventListener('input', e=>{
  const el = e.target, i = el.dataset.i, f = el.dataset.f;
  if(i==null||!f) return;
  drafts[i][f] = el.value;
  if(f==='type') el.closest('.draft').style.setProperty('--type-c', TYPES[el.value].color);
});
$('#drafts').addEventListener('click', e=>{
  const rm = e.target.dataset.rm;
  if(rm!=null){ drafts.splice(+rm,1); renderDrafts(); }
});

$('#btnSave').onclick = async ()=>{
  if(!drafts.length) return;
  DATA = [...drafts.map(d=>({...d, updatedAt: Date.now()})), ...DATA];
  drafts = []; $('#raw').value=''; renderDrafts();
  await persist(); renderAll();
  toast('등록했습니다');
  $$('.tab')[0].click();
};

document.body.addEventListener('click', e=>{
  if(e.target.classList.contains('more')){
    const rb = e.target.previousElementSibling;
    const on = rb.classList.toggle('clamp');
    e.target.textContent = on ? '전체 보기' : '접기';
    return;
  }
  const edit = e.target.closest('[data-edit]');
  if(edit){
    const d = DATA.find(x=>x.id===edit.dataset.edit);
    if(d) confirmEdit(d).then(ok=>{ if(ok) openModal(d); });
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    const d = DATA.find(x=>x.id===del.dataset.del);
    if(d) confirmDelete(d).then(async ok=>{
      if(!ok) return;
      DATA = DATA.filter(x=>x.id!==d.id);
      await persist(); renderAll(); toast('삭제했습니다');
    });
    return;
  }
  const read = e.target.closest('[data-read]');
  if(read){ const d = DATA.find(x=>x.id===read.dataset.read); if(d) openView(d); return; }
  const view = e.target.closest('[data-view]');
  if(view){ const d = DATA.find(x=>x.id===view.dataset.view); if(d) openView(d); return; }
  const sc = e.target.closest('[data-site]');
  if(sc){ siteFilter = sc.dataset.site; typeFilter='all'; renderList(); $$('.tab')[2].click(); return; }
  if(e.target.id==='clearSite'){ siteFilter=null; renderList(); return; }
  const fc = e.target.closest('.fchip');
  if(fc){ typeFilter = fc.dataset.t; renderList(); }
});

$('#btnLink').onclick = openLinkDialog;
$('#linkStat').onclick = openLinkDialog;

$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(payload(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `아르떼조명상담이슈체커_백업_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('백업 파일을 저장했습니다');
};
$('#btnImport').onclick = ()=> $('#fileIn').click();
$('#fileIn').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const j = JSON.parse(r.result);
      const items = Array.isArray(j) ? j : j.items;
      if(!Array.isArray(items)) throw 0;
      const before = DATA.length;
      DATA = mergeItems(items, DATA);           // 기존 내용을 지우지 않고 합친다
      await persist(); renderAll();
      toast(`불러왔습니다 (새 이슈 ${DATA.length - before}건)`);
    }catch(err){ toast('이 파일은 읽을 수 없습니다'); }
    e.target.value='';
  };
  r.readAsText(f);
};

/* 창을 다시 열거나 돌아오면 공유 파일 쪽 변경을 반영 */
window.addEventListener('focus', ()=>{
  if(!fileHandle || linkState !== 'linked') return;
  if(Date.now() - lastPull < 5000) return;
  lastPull = Date.now();
  pullFile({silent:true});
});
window.addEventListener('beforeunload', ()=>{ if(fileHandle) writeFile(); });

/* ─────────── 시작 ─────────── */
(async function init(){
  const d = new Date();
  $('#today').textContent = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${'일월화수목금토'[d.getDay()]}요일`;
  const saved = await store.get();
  DATA = Array.isArray(saved) ? saved : [];
  renderDrafts();
  renderAll();
  renderLink();

  // 이전에 연결해 둔 파일이 있으면 복구
  if(supportsFS){
    const h = await idb.get('fileHandle');
    if(h){
      fileHandle = h;
      try{
        if(await fileHandle.queryPermission({mode:'readwrite'}) === 'granted'){
          linkState = 'linked';
          await pullFile({silent:true});
        }else{
          linkState = 'need-permission';
        }
      }catch(e){ linkState = 'need-permission'; }
      renderLink();
    }
  }
})();
</script>
</body>
</html>
